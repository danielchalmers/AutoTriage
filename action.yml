name: "AutoTriage"
description: "GitHub Action for AI-assisted issue and pull request triage using a repository-defined prompt."
author: "Daniel Chalmers"
branding:
  color: "blue"
  icon: "git-pull-request"

inputs:
  additional-instructions:
    description: "Extra prompt instructions for this run."
    required: false
  budget-scale:
    description: "Multiplier for prompt context limits."
    required: false
    default: "1"
  db-path:
    description: "Path to the triage history JSON file."
    required: false
  dry-run:
    description: "Log planned actions without applying changes. Must be true or false."
    required: false
    default: "false"
  extended:
    description: "Broaden backlog auto-discovery."
    required: false
    default: "false"
  issues:
    description: "Issue or PR numbers separated by spaces or commas, such as \"12, #34\"."
    required: false
  max-fast-runs:
    description: "Maximum fast-model analyses per run."
    required: false
    default: "100"
  max-pro-runs:
    description: "Maximum review-model analyses per run."
    required: false
    default: "20"
  model-fast:
    description: "Fast-pass model. Leave blank to skip."
    required: false
    default: ""
  model-pro:
    description: "Review model. Blank uses the default for the API key you set (gemini-3.5-flash-lite for GEMINI_API_KEY)."
    required: false
    default: ""
  prompt-path:
    description: "Repo-relative path to the triage prompt."
    required: false
    default: ".github/AutoTriage.prompt"

runs:
  using: "node24"
  main: "dist/index.js"
