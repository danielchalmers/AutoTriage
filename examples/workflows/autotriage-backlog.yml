name: AutoTriage (Backlog)

on:
  schedule:
    # This runs after Gemini's daily quota resets at midnight Pacific, and avoids the busy top of the hour.
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      issues:
        description: 'Space-separated issue numbers'
        required: false
      dry-run:
        description: 'Dry run (true = no writes)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: autotriage
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: triage-db-

      - name: AutoTriage - triage backlog
        uses: danielchalmers/AutoTriage@v4
        with:
          issues: ${{ github.event.inputs.issues }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run || false }}
          db-path: triage-db.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Or use Claude or OpenAI instead (see the README's Models section):
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Save even when the run fails, so the items it already triaged aren't triaged again next time.
      - if: always() && hashFiles('triage-db.json') != ''
        uses: actions/cache/save@v6
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: |
            triage-db.json
            artifacts/
