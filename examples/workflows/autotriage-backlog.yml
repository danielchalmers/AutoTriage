name: AutoTriage (Backlog)

on:
  schedule:
    # This runs after Gemini's daily quota resets at midnight Pacific, and avoids the busy top of the hour.
    - cron: '23 8 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: autotriage
      queue: max
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: triage-db-

      - uses: danielchalmers/AutoTriage@v5
        with:
          dry-run: "true" # change to "false" after reviewing the plan output
          db-path: triage-db.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Save even when the run fails, so the items it already triaged aren't triaged again next time.
      - if: always() && hashFiles('triage-db.json') != ''
        uses: actions/cache/save@v6
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}-${{ github.run_attempt }}
