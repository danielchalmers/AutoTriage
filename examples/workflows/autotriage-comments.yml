name: AutoTriage (Comments)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage_comment:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: autotriage
      queue: max
    steps:
      - uses: actions/checkout@v7

      # Comment runs get read-only cache access, so they restore the backlog sweep's triage history but never save it.
      - uses: actions/cache/restore@v6
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: triage-db-

      - name: AutoTriage - triage comment
        uses: danielchalmers/AutoTriage@v4
        with:
          db-path: triage-db.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Or use Claude or OpenAI instead (see the README's Models section):
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
