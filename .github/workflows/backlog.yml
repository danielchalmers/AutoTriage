name: AutoTriage (Backlog)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      issues:
        description: 'Space-separated issue numbers'
        required: false
      dry-run:
        description: 'Dry run (true = no writes)'
        type: boolean
        required: false
      additional-instructions:
        description: 'Additional instructions appended to the prompt'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: autotriage-shared-db
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select backlog mode
        id: backlog-mode
        shell: bash
        run: |
          extended_run=false
          # Run the heavier extended sweep on days 1, 4, 7, etc. (every third UTC day of the year).
          if (( (10#$(date -u +%j) - 1) % 3 == 0 )); then
            extended_run=true
          fi

          echo "extended=$extended_run" >> "$GITHUB_OUTPUT"
          echo "context-caching=$extended_run" >> "$GITHUB_OUTPUT"
          echo "max-fast-runs=100" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: triage-db.json
          key: triage-db-${{ github.run_id }}
          restore-keys: triage-db-

      - name: AutoTriage - triage backlog
        uses: ./
        with:
          issues: ${{ github.event.inputs.issues }}
          prompt-path: .github/AutoTriage.prompt
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run || false }}
          db-path: triage-db.json
          extended: ${{ steps.backlog-mode.outputs.extended }}
          context-caching: ${{ steps.backlog-mode.outputs.context-caching }}
          max-fast-runs: ${{ steps.backlog-mode.outputs.max-fast-runs }}
          additional-instructions: ${{ github.event.inputs.additional-instructions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: |
            triage-db.json
            artifacts/
