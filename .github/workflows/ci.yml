name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

# A newer push to a pull request cancels its older run, because restacking a stack pushes each branch several times within seconds.
# Pushes to main each get their own group, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Runs typecheck, typecheck:test, the unit tests, build and check:dist.
      - name: Verify
        run: npm run verify
      - name: Mock triage
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          issues: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '3 6' }}
          dry-run: true
          model: claude-haiku-5-5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: artifacts/
