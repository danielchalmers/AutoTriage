name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fork and Dependabot PRs don't receive repository secrets, so the live triage step is skipped for them.
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Ensure dist is up to date
        id: check-dist
        run: npm run check:dist
      - name: Upload rebuilt dist
        if: failure() && steps.check-dist.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Mock triage
        id: mock-triage
        if: github.event_name == 'pull_request' && env.HAS_GEMINI_KEY == 'true'
        uses: ./
        with:
          issues: ${{ github.event.pull_request.number }}
          prompt-path: examples/AutoTriage.prompt
          dry-run: true
          model-fast: gemini-3.5-flash-lite
          model-pro: gemini-3.5-flash-lite # Save API usage by using a cheap model again but we can still test two-pass system.
          strict-mode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload artifacts
        if: always() && steps.mock-triage.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: triage-artifacts-${{ github.run_number }}
          path: |
            triage-db.json
            artifacts/
