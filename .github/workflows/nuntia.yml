name: Nuntia (Release Notes)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prompt-url:
        description: "Raw prompt URL to try (blank uses the bundled prompt)"
        required: false
        default: ""

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Writes the notes into the release.
      issues: read
      pull-requests: read
    steps:
      - uses: danielchalmers/Nuntia@v2
        with:
          prompt-url: ${{ inputs.prompt-url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuntia-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore
